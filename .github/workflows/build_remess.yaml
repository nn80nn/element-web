# Builds the Remess desktop app for Linux, macOS and Windows.
#
# This deliberately does not reuse the upstream build_desktop_* workflows: those are wired
# into Element's release pipeline (they check out element-hq/element-web by name, expect
# Element's signing secrets, and publish to packages.element.io). This one just does what
# apps/desktop/remess/build.ps1 does locally, once per platform.
#
# Run it from the Actions tab; artifacts are attached to the run.
name: Build Remess

on:
    workflow_dispatch:
        inputs:
            platforms:
                description: "Which platforms to build"
                type: choice
                default: "all"
                options:
                    - all
                    - linux
                    - macos
                    - windows
            element-call-ref:
                description: "Branch or tag of the element-call fork to build against"
                type: string
                default: "livekit"

permissions: {}

jobs:
    # The platform filter has to happen here rather than as an `if` on the build job: the
    # matrix context isn't available to a job-level `if`, so it can't test what it selects.
    # Matrix keys deliberately avoid hyphens, which GitHub's expression parser reads as
    # subtraction rather than as part of a property name.
    select:
        name: Select platforms
        runs-on: ubuntu-24.04
        outputs:
            include: ${{ steps.select.outputs.include }}
        steps:
            - name: Select platforms
              id: select
              env:
                  PLATFORMS: ${{ inputs.platforms }}
              run: |
                  set -euo pipefail
                  all='[
                    {"platform": "linux",   "runner": "ubuntu-24.04",   "builderArgs": "--linux --x64"},
                    {"platform": "macos",   "runner": "macos-latest",   "builderArgs": "--mac --universal"},
                    {"platform": "windows", "runner": "windows-latest", "builderArgs": "--win --x64"}
                  ]'
                  if [ "$PLATFORMS" = "all" ]; then
                      include=$(jq -c . <<<"$all")
                  else
                      include=$(jq -c --arg p "$PLATFORMS" '[.[] | select(.platform == $p)]' <<<"$all")
                  fi
                  echo "include=$include" >> "$GITHUB_OUTPUT"

    build:
        needs: select
        strategy:
            # One platform failing shouldn't throw away the others' artifacts.
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.select.outputs.include) }}
        name: ${{ matrix.platform }}
        # macOS is built universal so the result runs on both Apple Silicon and Intel; we
        # ship no native modules, so there is nothing that has to be built twice.
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        defaults:
            run:
                # Keeps a single set of shell commands working on all three runners.
                shell: bash
        env:
            VARIANT_PATH: remess/release/build.json
            # Corepack must never stop to ask whether it may download a package manager.
            COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
            # We have no code signing identity; without this electron-builder goes looking
            # for one in the keychain and fails the macOS build rather than building unsigned.
            CSC_IDENTITY_AUTO_DISCOVERY: "false"

        steps:
            # Must precede any checkout. Git on the Windows runner rewrites line endings by
            # default, and Nx's pnpm lockfile parser then fails on the multi-document
            # pnpm-lock.yaml with "expected a single document in the stream, but found more".
            - name: Keep line endings as committed
              if: runner.os == 'Windows'
              run: git config --global core.autocrlf false

            - name: Check out Remess
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  persist-credentials: false

            - name: Check out the element-call fork
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  repository: nn80nn/element-call
                  ref: ${{ inputs.element-call-ref }}
                  path: element-call
                  persist-credentials: false

            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Three pnpm versions are in play here and each one matters in a different place.
            #
            # The install itself must run element-call's pinned version: its
            # pnpm-workspace.yaml has an allowBuilds key keyed by a git URL, which older pnpm
            # rejects with ERR_PNPM_INVALID_VERSION_UNION.
            #
            # Preparing the git-hosted matrix-js-sdk then runs a nested `pnpm install` inside
            # the fetched tarball, which insists on the version *that* package pins. The
            # nested call locates pnpm through PNPM_HOME -- it kept picking up 11.5.2 from
            # there even with that directory removed from PATH entirely -- so point PNPM_HOME
            # at the version it wants. Its config comes from the tarball, so settings in
            # either repository cannot reach it; matching the version is the way through.
            - name: Build element-call (embedded)
              working-directory: element-call
              run: |
                  set -euo pipefail
                  nested="$(pwd)/.pnpm-nested"
                  npm install --prefix "$nested" --no-save --no-audit --no-fund pnpm@11.2.2
                  export PNPM_HOME="$nested/node_modules/.bin"
                  export PATH="$PNPM_HOME:$PATH"
                  echo "pnpm for the nested install: $(pnpm --version)"
                  npx --yes pnpm@11.6.0 install --frozen-lockfile
                  NODE_OPTIONS=--max-old-space-size=16384 npx --yes pnpm@11.6.0 exec vite build --config vite-embedded.config.ts

            - name: Build the web app
              working-directory: apps/web
              run: pnpm run build

            - name: Overlay the element-call fork onto the bundled widget
              run: |
                  set -euo pipefail
                  widget=apps/web/webapp/widgets/element-call
                  rm -rf "$widget"
                  cp -r element-call/dist "$widget"
                  # A plain web build copies the stock Element Call over the top of our fork,
                  # so check a fork-only string actually survived into the bundle.
                  if ! grep -rq "dtln-suppressor" "$widget/assets"; then
                      echo "Bundled widget does not look like our fork" >&2
                      exit 1
                  fi

            - name: Stage the desktop webapp
              run: |
                  set -euo pipefail
                  rm -rf apps/desktop/webapp
                  cp -r apps/web/webapp apps/desktop/webapp
                  cp apps/desktop/remess/release/config.json apps/desktop/webapp/config.json

            - name: Pack webapp.asar
              working-directory: apps/desktop
              run: pnpm exec asar p webapp webapp.asar

            # Packaging is by far the longest step, and a good part of that is electron-builder
            # fetching the same things every run: the Electron binaries, and the fpm and 7zip
            # helpers it shells out to. Keyed on the desktop package.json, which is what pins
            # the Electron version. The paths for the three runner families are all listed;
            # cache ignores the ones that don't exist.
            - name: Cache electron-builder downloads
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/.cache/electron
                      ~/.cache/electron-builder
                      ~/Library/Caches/electron
                      ~/Library/Caches/electron-builder
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}
                  restore-keys: electron-builder-${{ runner.os }}-${{ runner.arch }}-

            # The pacman target shells out to bsdtar to build the package's .MTREE, and the
            # runner image doesn't ship it. Without this the Arch package fails at the very
            # last step with a bare "exit code 127", after everything else has built.
            - name: Install packaging tools
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libarchive-tools

            - name: Build the desktop app
              working-directory: apps/desktop
              run: |
                  set -euo pipefail
                  pnpm exec tsc
                  node scripts/copy-res.ts
                  pnpm exec electron-builder ${{ matrix.builderArgs }} --publish=never

            - name: Collect installers
              run: |
                  set -euo pipefail
                  mkdir -p out
                  # Only what someone would actually download. The unpacked application
                  # directories contain a same-named .exe that is not an installer, and
                  # Squirrel ships helper binaries next to the installer it produces;
                  # including any of them just leaves the reader guessing which to run.
                  find apps/desktop/dist -maxdepth 2 -type f \
                      \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.zip" \
                      -o -name "*.deb" -o -name "*.AppImage" -o -name "*.pacman" -o -name "*.tar.gz" \) \
                      ! -path "*unpacked*" \
                      ! -name "Squirrel.exe" \
                      ! -name "*ExecutionStub*" \
                      -exec cp {} out/ \;
                  ls -lh out

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: remess-${{ matrix.platform }}
                  path: out/
                  if-no-files-found: error
